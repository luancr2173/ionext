<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>IONEXT — Agentes de IA para vendas e atendimento</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Agência de IA em Brasília: agentes que respondem no WhatsApp em segundos, qualificam clientes e agendam reuniões 24/7. Peça um diagnóstico gratuito."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0a0c" />
    <link rel="canonical" href="https://ionext.com.br/" />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ionext-theme');
          var theme =
            saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0a0a0c' : '#f4f2ee');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
