<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>IONEXT — IA e Automação para Todo o Funil de Vendas</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Do primeiro contato ao pós-venda, automatizamos o que trava o crescimento da sua empresa com inteligência artificial e processos sob medida."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#000000" />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ionext-theme');
          var theme =
            saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#000000' : '#ffffff');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ionext.com.br/" />
    <meta property="og:title" content="IONEXT — IA e Automação para Todo o Funil de Vendas" />
    <meta
      property="og:description"
      content="Do primeiro contato ao pós-venda, automatizamos o que trava o crescimento da sua empresa com IA."
    />
    <meta property="og:image" content="https://ionext.com.br/icon-512x512.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IONEXT — IA e Automação para Todo o Funil de Vendas" />
    <meta
      name="twitter:description"
      content="Do primeiro contato ao pós-venda, automatizamos o que trava o crescimento da sua empresa com IA."
    />
    <meta name="twitter:image" content="https://ionext.com.br/icon-512x512.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- Preconnect and Google Fonts Inter fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body ontouchstart="">
    <app-root></app-root>
  </body>
</html>
