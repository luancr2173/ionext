<app-loader />
<a href="#main-content" class="skip-to-content">Pular para o conteúdo principal</a>
<div class="page-transition-bar" [class.is-active]="isNavigating()" aria-hidden="true"></div>

<!-- Fixed Navigation Bar with Translucent Blur & Logo -->
@if (!isCrm()) {
  <app-navbar />
}

<main id="main-content">
  <router-outlet />
</main>

@if (!isCrm()) {
  <!-- Footer -->
  <app-footer />
}

<!-- Floating Lateral Scroll-to-Top Arrow Button -->
@if (!isCrm()) {
  <app-scroll-to-top />
}

<!-- WhatsApp flutuante (todas as páginas) -->
@if (!isCrm()) {
  <app-whatsapp-float />
}
